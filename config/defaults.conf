MODE=auto
ACTIVE_PROFILE=

# Health check interval: systemd time span, e.g. 30m, 1h, 2h, 6h
HEALTH_INTERVAL=1h

PING_COUNT=3
TIMEOUT=2
MOVING_AVERAGE=5

# Minimum score advantage required before switching profiles.
HYSTERESIS=8

# Minimum seconds between profile switches.
COOLDOWN=120

FAIL_THRESHOLD=3
RECOVERY_THRESHOLD=2
RTT_WEIGHT=35
JITTER_WEIGHT=25
LOSS_WEIGHT=25
SUCCESS_WEIGHT=15
TEST_URL=https://cp.cloudflare.com/generate_204
SOCKS_LISTEN=0.0.0.0
SOCKS_PORT=1080
CONFIG_FILE=/etc/sing-box/config.json
STATE_FILE=/etc/sing-box/proxy-state.json
PROFILE_DIR=/etc/sing-box/profiles
LOG_DIR=/var/log/smartproxy
LOG_FILE=/var/log/smartproxy/proxy.log
