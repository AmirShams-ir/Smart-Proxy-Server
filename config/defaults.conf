###############################################################################
# Smart DNS Server
# Default Configuration
###############################################################################

SMARTDNS_VERSION="1.0.0-beta1"

###############################################################################
# Network
###############################################################################

ENABLE_IPV6="yes"

DNS_PORT="53"

DNS_INTERFACE="127.0.0.1"

###############################################################################
# Performance
###############################################################################

CACHE_MIN_TTL="300"

CACHE_MAX_TTL="86400"

CACHE_MSG_SIZE="64m"

CACHE_RRSET_SIZE="128m"

THREADS="auto"

PREFETCH="yes"

SERVE_EXPIRED="yes"

###############################################################################
# Security
###############################################################################

DNSSEC="yes"

QNAME_MINIMISATION="yes"

HIDE_VERSION="yes"

HIDE_IDENTITY="yes"

###############################################################################
# Benchmark
###############################################################################

MIN_LOCAL=1

MIN_GLOBAL=1

TOP_SERVERS=3

MAX_PER_PROVIDER=1

BENCHMARK_INTERVAL="1h"

PING_TIMEOUT="1"

DIG_TIMEOUT="2"

###############################################################################
# Logging
###############################################################################

LOG_DIR="/var/log/smartdns"

###############################################################################
# Block Mode
###############################################################################

BLOCK_MODE=nxdomain


###############################################################################
# Rearm Mode
###############################################################################

AUTO_REARM="yes"

AUTO_REARM_INTERVAL="1h"