PING_COUNT=3
TIMEOUT=2
MOVING_AVERAGE=5
HYSTERESIS=8
COOLDOWN=120
FAIL_THRESHOLD=3
RECOVERY_THRESHOLD=2
RTT_WEIGHT=35
JITTER_WEIGHT=25
LOSS_WEIGHT=25
