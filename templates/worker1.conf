[worker]
# Friendly identifier used in generated profile names.
Name=Nahan

# Worker hostname / Cloudflare Worker domain.
Host=amir.irf.workers.dev

# UUID for VLESS / VMess / TUIC where applicable.
UUID=2d556f14-54f5-a3ab-d6f5-943400000000

# SNI / TLS server name. Can contain multiple alternatives.
SNI=amir.irf.workers.dev

# Ports to test. Example: 443,8443,2053,2083,2087,2096,80,8080
Ports=443,8443,80,8080

# Protocols supported by this Worker.
# Common sing-box outbound types include:
# vless,vmess,trojan,shadowsocks,tuic,hysteria2,shadowtls,anytls,snell,naive
# Only list protocols actually deployed on the Worker.
Types=vless,trojan

# Network layer used by the protocol.
# sing-box V2Ray transports: tcp,ws,http,grpc,httpupgrade,quic
# QUIC-based protocols such as TUIC/Hysteria2 use their protocol-specific mode.
Transport=tcp,ws,grpc

# TLS mode. Use only modes actually supported by the protocol/Worker.
# tls = normal TLS, none = no TLS, reality = Reality-style TLS configuration.
Security=tls,none

# ALPN alternatives. Examples: h2,http/1.1
ALPN=

# TLS fingerprint used by sing-box where supported.
# Examples: chrome,firefox,safari,edge,ios,android,random
Fingerprint=chrome

# Allow insecure TLS certificate verification (normally false).
AllowInsecure=false

# VLESS flow. Empty means no flow. Current sing-box VLESS flow commonly used:
# xtls-rprx-vision,xtls-rprx-vision-udp443
Flow=

# WebSocket path alternatives.
WSPath=/sync
